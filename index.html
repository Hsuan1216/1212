<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hsin Chia & Yi Hsuan Wedding Invitation</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #d4a373;
            --secondary: #8da399;
            --bg-warm: #fcf9f5;
            --text-dark: #3a3835;
            --text-muted: #736f6a;
            --card-bg: rgba(255, 255, 255, 0.92);
            --shadow-soft: 0 10px 30px rgba(212, 163, 115, 0.12);
            --shadow-card: 0 15px 35px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Serif TC', Georgia, serif;
            background-color: var(--bg-warm);
            color: var(--text-dark);
            line-height: 1.8;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-en {
            font-family: 'Cormorant Garamond', 'Noto Serif TC', Georgia, serif;
        }

        .no-wrap {
            white-space: nowrap;
        }

        /* 1. 毛玻璃導航列 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(252, 249, 245, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(212, 163, 115, 0.15);
            padding: 1rem 0;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* 2. 封面英雄區塊 */
        .hero {
            height: 100vh;
            min-height: 600px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.45)), 
                        url('https://i.postimg.cc/tgWvvRCp/RCH-9738.jpg') center/cover no-repeat;
        }

        .hero-content {
            padding: 2rem;
            max-width: 800px;
        }

        .hero-names {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .hero-slogan {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            margin-bottom: 2.5rem;
            opacity: 0.95;
            line-height: 1.8;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }

        /* 倒數計時器元件 */
        .countdown-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 1.25rem 1.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: fit-content;
            margin: 0 auto;
        }

        .timer-card {
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-dark);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            min-width: 68px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-val {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            line-height: 1;
            color: var(--primary);
        }

        .timer-unit {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            letter-spacing: 1px;
        }

        .timer-divider {
            width: 1px;
            height: 35px;
            background: rgba(255, 255, 255, 0.5);
        }

        /* 通用 Section 樣式 */
        .section-padding {
            padding: 5rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-size: 2.2rem;
            color: var(--primary);
            letter-spacing: 2px;
            margin-bottom: 0.25rem;
        }

        .section-title p {
            font-size: 0.85rem;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* 3. V-Card 婚禮資訊 */
        .v-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(212, 163, 115, 0.2);
            text-align: center;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .info-item h4 {
            color: var(--secondary);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .info-item p {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* 交通摺疊面板 */
        .accordion {
            margin-top: 2.5rem;
            border-top: 1px solid rgba(212, 163, 115, 0.2);
            text-align: left;
        }

        .accordion-item {
            border-bottom: 1px solid rgba(212, 163, 115, 0.2);
        }

        .accordion-header {
            width: 100%;
            padding: 1.25rem 0;
            background: none;
            border: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            font-family: inherit;
            color: var(--text-dark);
            cursor: pointer;
            transition: color 0.3s;
        }

        .accordion-header:hover {
            color: var(--primary);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0, 1, 0, 1);
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .accordion-content-inner {
            padding-bottom: 1.25rem;
        }

        /* 4. 出席回函表單 */
        .form-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(141, 163, 153, 0.2);
        }

        .form-group {
            margin-bottom: 1.8rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-label span {
            font-family: 'Cormorant Garamond', serif;
            color: var(--secondary);
            font-size: 0.85rem;
            margin-left: 0.4rem;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid #e2dcd5;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            background-color: #faf8f5;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.15);
        }

        /* 智能動態顯示區塊 */
        .conditional-field {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(212, 163, 115, 0.3);
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: #c29263;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 163, 115, 0.4);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(212, 163
